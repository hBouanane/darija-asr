[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "darija-asr"
version = "0.1.0"
description = "Multi-ASR + LLM-judge pipeline for building a cleaner Moroccan Darija ASR dataset (MoulSot), evaluating it, and preparing training data."
requires-python = ">=3.10"
dependencies = [
    "pyyaml",
    "numpy",
    "pandas",
    "pyarrow",
    "soundfile",
    "librosa",
    "huggingface_hub>=0.30",
    "datasets>=3.0",
    "rapidfuzz>=3.0",
    "jiwer>=3.0",
    "tabulate",
    "anthropic",
    "tqdm",
]

[project.optional-dependencies]
# Cohere + Voxtral:  uv sync --extra asr
asr = [
    "torch",
    "transformers>=5.4.0",
    "accelerate",
    "sentencepiece",
    "protobuf",
    "mistral-common[audio]",
]
# MoulSot.0.3 (Qwen3-ASR fine-tune):  uv sync --extra moulsot
moulsot = ["torch", "qwen_asr"]

[dependency-groups]
dev = ["pytest"]

[project.scripts]
darija = "darija_asr.cli:main"

[tool.uv]
# qwen_asr pins its own transformers version, so the two model stacks are
# resolved separately and never installed into the same environment.
conflicts = [[{ extra = "asr" }, { extra = "moulsot" }]]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
