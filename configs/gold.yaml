# Gold set: clips from MoulSot's held-out 100-gt-2.5 TEST split (MoulSot never
# trained on them, so all four sources are fair here). Judge everything, export,
# then hand-correct gold/gold.csv. The other runs use the train split or
# extra-gt, so they never overlap with gold.
extends: base.yaml
run_name: gold

source:
  config: 100-gt-2.5
  split: test

select:
  n: 500
  max_per_channel: 60 # the test split has only ~6 channels
  exclude_ids: []

agreement:
  sources: [reference, cohere, voxtral, moulsot]
