# Iteration 2: new clips from extra-gt-2.5 (no reference text). Only the ASR
# models vote. Add `moulsot` to sources (after transcribing with it) to get a
# third, Darija-specialised voter as a tie-breaker.
extends: base.yaml
run_name: extra-gt-v1

source:
  config: extra-gt-2.5
  split: train
  has_reference: false

select:
  n: 30000
  max_per_channel: 400      # extra-gt files hold 1-3 channels each; all 242 are read for metadata

agreement:
  sources: [cohere, voxtral]       # + moulsot
  prefer: [cohere, voxtral]
